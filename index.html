<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Marc Kimmel Dot Com</title>
<meta name="description" content="Marc Kimmel — design leader & builder. A live, interactive wordmark.">
<link id="fav" rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@800&family=Fraunces:opsz,wght@9..144,900&family=Space+Mono:wght@700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0A0A;--fg:#FFFFFF;--ff:'Archivo';--fw:800}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);cursor:none;
  font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background .5s ease,color .5s ease}

/* ---- structural chrome (persists across versions) ---- */
#marquee{position:fixed;top:0;left:0;right:0;height:46px;z-index:40;overflow:hidden;
  display:flex;align-items:center;border-bottom:2px solid var(--fg);background:var(--bg);
  transition:background .5s,border-color .5s}
.mq-track{display:inline-flex;white-space:nowrap;will-change:transform;animation:mq 34s linear infinite}
.mq-track span{font-size:14px;letter-spacing:.16em;text-transform:uppercase;padding:0 1.25em;color:var(--fg)}
.mq-track .sep{padding:0 .1em;opacity:.5;letter-spacing:0;font-size:.9em}
@keyframes mq{to{transform:translateX(-50%)}}

#bar{position:fixed;bottom:0;left:0;right:0;height:34px;z-index:40;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 14px;white-space:nowrap;
  border-top:2px solid var(--fg);background:var(--bg);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;transition:background .5s,border-color .5s}
#bar a{color:var(--fg);text-decoration:none}
#bar a:hover{text-decoration:underline}
#bar>a,#bar>.right{flex:none}
#bar>.right{display:inline-flex;gap:1.4em;align-items:center}
#next{cursor:none;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;line-height:1;font-weight:700}
#next .kh{display:inline-flex;align-items:center;gap:.6em;font-size:11px;letter-spacing:.08em;opacity:.72;transition:opacity .2s}
#next .kh kbd{font-family:inherit;font-weight:700;font-size:10px;letter-spacing:.14em;padding:4px 7px 5px;border:1.5px solid var(--fg);border-radius:5px;line-height:1}
#next .th{display:none;align-items:center;padding:5px 14px;border:1.6px solid var(--fg);border-radius:999px;transition:background .3s,color .3s,transform .1s}
#next:hover .kh{opacity:1}
#readout{flex:1;min-width:0;opacity:.7;text-align:center;overflow:hidden;text-overflow:ellipsis}

#grid{position:fixed;inset:46px 0 34px;z-index:6;pointer-events:none;mix-blend-mode:difference;opacity:.12;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(16.666% - 1px),#fff calc(16.666% - 1px),#fff 16.666%)}

/* ---- stage where each mode mounts ---- */
#stage{position:fixed;inset:46px 0 34px;z-index:10;overflow:hidden;isolation:isolate;background:var(--bg);
  touch-action:none;transition:background .5s}
#stage.inverted{filter:invert(1)}

.lines{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:0}
.line{display:flex;justify-content:space-between;align-items:center;padding:0 2.2vw;line-height:.78;white-space:nowrap}
.ltr{font-family:var(--ff);font-weight:var(--fw);font-size:min(41vh,23vw);color:var(--fg);
  display:inline-block;will-change:transform;flex:none}
.ltr.ol{color:transparent;-webkit-text-stroke:3px var(--fg);text-stroke:3px var(--fg)}
.ltr.balloon{font-family:"Comic Sans MS","Chalkboard SE","Comic Neue",system-ui,sans-serif;font-weight:700}

.msvg{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas.play{position:absolute;inset:0;width:100%;height:100%;display:block}

.invlens{position:fixed;width:720px;height:720px;border-radius:50%;background:#fff;
  mix-blend-mode:difference;pointer-events:none;z-index:20;margin:-360px 0 0 -360px;will-change:transform}

/* ---- custom cursor ---- */
#cursor{position:fixed;left:0;top:0;z-index:60;pointer-events:none;will-change:transform;
  width:26px;height:26px;margin:-13px 0 0 -13px;transition:width .2s,height .2s,margin .2s,opacity .2s}
#cursor .ring{width:100%;height:100%;border-radius:50%;border:2px solid var(--fg);mix-blend-mode:difference}
#cursor.PUSH{width:60px;height:60px;margin:-30px 0 0 -30px}
#cursor.INVERT{opacity:0}
#cursor.MELT .ring,#cursor.MAGNET .ring{border-radius:50%;background:var(--fg);border:none}
#cursor.MAGNET{width:16px;height:16px;margin:-8px 0 0 -8px}
#cursor.SPILL,#cursor.KALEIDO{width:14px;height:14px;margin:-7px 0 0 -7px}
#cursor.SPILL .ring,#cursor.KALEIDO .ring{border-width:2px}
#cursor.SPOTLIGHT{width:57px;height:57px;margin:-28.5px 0 0 -28.5px}
#cursor.SCRATCH{width:228px;height:228px;margin:-114px 0 0 -114px}
#cursor.SHELF{width:18px;height:18px;margin:-9px 0 0 -9px}
#cursor.BLOOM,#cursor.NEON{width:16px;height:16px;margin:-8px 0 0 -8px}
#cursor.PINBALL{opacity:0}
#cursor.REDACT{width:16px;height:44px;margin:-22px 0 0 -8px}
#cursor.REDACT .ring{border-radius:46%;background:var(--fg);border:none;mix-blend-mode:normal;opacity:.7}

@media (prefers-reduced-motion:reduce){.mq-track{animation:none}}

/* ---- small screens: declutter the bar, grow the tap target ---- */
@media (max-width:640px){
  #readout,.geo{display:none}
  #marquee{height:calc(46px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
  .bl{font-size:11px}
}
/* ---- touch devices: no keyboard, so show a big tappable button instead of the Space hint ---- */
@media (pointer:coarse) and (hover:none){
  #cursor{display:none}
  body{cursor:auto}
  #next .kh{display:none}
  #next .th{display:inline-flex;padding:17px 32px;font-size:16px;letter-spacing:.14em;border-width:2px}
  #next:active .th{background:var(--fg);color:var(--bg);transform:scale(.94)}
  #bar{height:calc(76px + env(safe-area-inset-bottom));padding:0 16px env(safe-area-inset-bottom);font-size:11px;gap:12px}
}
</style>
</head>
<body>
<div id="marquee"><div class="mq-track" id="mqt"></div></div>
<div id="grid"></div>
<div id="stage"></div>
<div id="cursor"><div class="ring"></div></div>
<footer id="bar">
  <span class="bl">mkimmel@gmail.com</span>
  <span id="readout">—</span>
  <span class="right"><span id="next" role="button" tabindex="0" aria-label="Next mode"><span class="kh">Next <kbd>SPACE</kbd></span><span class="th">NEXT →</span></span><span class="geo">Vancouver · <span id="date">—</span></span></span>
</footer>

<script>
const stage=document.getElementById("stage"),cursorEl=document.getElementById("cursor"),
      readout=document.getElementById("readout"),body=document.body;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W=innerWidth,H=innerHeight-80,DPR=Math.min(2,devicePixelRatio||1);

document.getElementById("date").textContent=
  new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}).toUpperCase();

/* marquee content from the JD */
const MQ=["Marc Kimmel","Design Director, Whisk @ Samsung","Experiences That Enrich & Elevate Daily Life","Building & Leading Global Teams","Prototyping AI-First Experiences","Customer Insights & Behavioural Science","Solve Problems, Tell Stories, Build Momentum"];
const SEP=["✦","☺︎","•","✈︎","❋","◆","✷"];/* unique little monotone separators, one per statement */
document.getElementById("mqt").innerHTML=[0,1].map(()=>MQ.map((s,i)=>`<span>${s}</span><span class="sep">${SEP[i%SEP.length]}</span>`).join("")).join("");

/* ---- palettes: mostly high-contrast mono, occasional single accent ---- */
const PALS=[
 {bg:"#0A0A0A",fg:"#FFFFFF"},{bg:"#FFFFFF",fg:"#0A0A0A"},
 {bg:"#0A0A0A",fg:"#FFFFFF"},{bg:"#F2F0EA",fg:"#111111"},
 {bg:"#0A0A0A",fg:"#E8FF00"},{bg:"#111111",fg:"#FF3B3B"},
 {bg:"#1B1BFF",fg:"#FFFFFF"},{bg:"#FF3B3B",fg:"#111111"},
 {bg:"#E9EFEF",fg:"#05080A"},{bg:"#05080A",fg:"#2FE8D5"},
 {bg:"#0A0A0A",fg:"#FF5AF2"},{bg:"#FFE600",fg:"#0A0A0A"},
 {bg:"#0033FF",fg:"#FFFFFF"},{bg:"#00FF9C",fg:"#05140F"},
 {bg:"#1A1A1A",fg:"#FF6A00"},{bg:"#FF2D55",fg:"#FFFFFF"},
 {bg:"#101010",fg:"#B14BF4"},{bg:"#EDEAE2",fg:"#E5322D"}
];
const FONTS=[{f:"'Anton'",w:400},{f:"'Archivo'",w:800},{f:"'Fraunces'",w:900},{f:"'Space Mono'",w:700}];
const rnd=(a=1,b=0)=>b+Math.random()*(a-b),pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---- dynamic favicon: a random geometric shape, redrawn on a timer ---- */
const favLink=document.getElementById("fav"),favCv=document.createElement("canvas");
favCv.width=favCv.height=64;const fcx=favCv.getContext("2d");
function makeFavicon(){const p=pick(PALS);
  fcx.clearRect(0,0,64,64);fcx.fillStyle=p.bg;fcx.fillRect(0,0,64,64);
  fcx.fillStyle=p.fg;fcx.strokeStyle=p.fg;fcx.lineCap="round";
  fcx.save();fcx.translate(32,32);fcx.rotate(rnd(6.283));
  const k=Math.floor(rnd(9));
  if(k===0){fcx.beginPath();fcx.arc(0,0,23,0,6.283);fcx.fill()}
  else if(k===1){fcx.lineWidth=11;fcx.beginPath();fcx.arc(0,0,17,0,6.283);fcx.stroke()}
  else if(k===2){fcx.fillRect(-23,-23,46,46)}
  else if(k===3){fcx.beginPath();fcx.moveTo(0,-27);fcx.lineTo(25,20);fcx.lineTo(-25,20);fcx.closePath();fcx.fill()}
  else if(k===4){fcx.beginPath();fcx.moveTo(0,-27);fcx.lineTo(27,0);fcx.lineTo(0,27);fcx.lineTo(-27,0);fcx.closePath();fcx.fill()}
  else if(k===5){fcx.beginPath();fcx.arc(0,0,26,0,Math.PI);fcx.fill()}
  else if(k===6){fcx.lineWidth=13;fcx.beginPath();fcx.moveTo(-22,0);fcx.lineTo(22,0);fcx.moveTo(0,-22);fcx.lineTo(0,22);fcx.stroke()}
  else if(k===7){fcx.beginPath();fcx.moveTo(-25,-25);fcx.lineTo(25,-25);fcx.lineTo(-25,25);fcx.closePath();fcx.fill()}
  else{for(let i=0;i<4;i++)for(let j=0;j<4;j++)if((i+j)%2===0)fcx.fillRect(-24+i*12,-24+j*12,12,12)}
  fcx.restore();favLink.href=favCv.toDataURL("image/png");
}
makeFavicon();setInterval(makeFavicon,2200);

/* ---- global pointer + custom cursor ---- */
let px=innerWidth/2,py=innerHeight/2,ppx=px,ppy=py,pspeed=0,pactive=false,pdown=false;
addEventListener("pointermove",e=>{px=e.clientX;py=e.clientY;pactive=true});
addEventListener("pointerdown",e=>{px=e.clientX;py=e.clientY;pactive=true;pdown=true});
addEventListener("pointerup",e=>{pdown=false;if(e.pointerType==="touch")pactive=false});
addEventListener("pointercancel",()=>{pdown=false;pactive=false});
document.addEventListener("mouseleave",()=>pactive=false);
let mvF=0;
function ptrLoop(){pspeed=pspeed*0.75+Math.hypot(px-ppx,py-ppy)*0.25;ppx=px;ppy=py;
  cursorEl.style.transform=`translate(${px}px,${py}px)`;
  if(pspeed>1){if((++mvF)%18===0&&typeof schedule==="function")schedule()}/* keep the current toy alive while you play */
  requestAnimationFrame(ptrLoop)}
ptrLoop();
/* stage-local pointer (y within stage, which starts 34px down) */
const sy=()=>py-46;

function sizeCanvas(cv){cv.width=W*DPR;cv.height=H*DPR}
function fitScale(ctx,txt,target){const w=ctx.measureText(txt).width;return w>0?target/w:1}
function shade(hex,amt){hex=hex.replace("#","");const c=[0,2,4].map(i=>Math.max(0,Math.min(255,parseInt(hex.slice(i,i+2),16)+amt)));return`rgb(${c[0]},${c[1]},${c[2]})`}
let curTreat="solid";/* solid | outline — random per version, adds typography-style variety */

/* text as individual letters (DOM) */
function domLetters(){const ol=curTreat==="outline"?" ol":"";
 stage.innerHTML=`<div class="lines"><div class="line">${[...'MARC'].map(c=>`<span class="ltr${ol}">${c}</span>`).join("")}</div><div class="line">${[...'KIMMEL'].map(c=>`<span class="ltr${ol}">${c}</span>`).join("")}</div></div>`;
 return [...stage.querySelectorAll('.ltr')];
}
/* text as fitted SVG (fills width) */
function svgText(fo,fill,extra=""){return `<svg class="msvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><g font-family="${fo.f}" font-weight="${fo.w}" text-anchor="middle" ${extra}><text x="${W/2}" y="${H*0.44}" font-size="${H*0.5}" fill="${fill}" textLength="${W*0.94}" lengthAdjust="spacingAndGlyphs">MARC</text><text x="${W/2}" y="${H*0.95}" font-size="${H*0.5}" fill="${fill}" textLength="${W*0.94}" lengthAdjust="spacingAndGlyphs">KIMMEL</text></g></svg>`}

/* single-stroke vector font (unit coords) — used by the STRING mode */
const GLY={M:[[0,1],[0,0],[.5,.55],[1,0],[1,1]],A:[[0,1],[.5,0],[1,1],[.72,.5],[.28,.5]],
 R:[[0,1],[0,0],[.8,0],[.95,.28],[.75,.5],[0,.5],[.95,1]],C:[[1,.18],[.6,0],[.18,.12],[0,.5],[.18,.88],[.6,1],[1,.82]],
 K:[[0,1],[0,0],[0,.52],[1,0],[.28,.5],[1,1]],I:[[.5,0],[.5,1]],E:[[1,0],[0,0],[0,.5],[.78,.5],[0,.5],[0,1],[1,1]],L:[[0,0],[0,1],[1,1]]};
function resample(pts,step){const out=[[pts[0][0],pts[0][1]]];let prev=pts[0],dist=0;
 for(let i=1;i<pts.length;i++){let cur=pts[i],dx=cur[0]-prev[0],dy=cur[1]-prev[1],d=Math.hypot(dx,dy);
   while(dist+d>=step){const t=(step-dist)/d,nx=prev[0]+dx*t,ny=prev[1]+dy*t;out.push([nx,ny]);prev=[nx,ny];dx=cur[0]-prev[0];dy=cur[1]-prev[1];d=Math.hypot(dx,dy);dist=0}
   dist+=d;prev=cur}
 return out}
function stringNodes(){const words=[["MARC",H*0.40],["KIMMEL",H*0.82]],lh=H*0.30,raw=[];
 words.forEach(([wd,cy])=>{const L=wd.length,cw=W*0.86/L,x0=W*0.07,lw=cw*0.66;
   for(let i=0;i<L;i++){const g=GLY[wd[i]],cellx=x0+cw*i+(cw-lw)/2;g.forEach(pt=>raw.push([cellx+pt[0]*lw,cy+(pt[1]-0.5)*lh]))}});
 return resample(raw,7)}
/* offscreen render of the fitted wordmark in a given colour — shared by shatter/dissolve/heatmap */
function nameCanvas(fo,color){const c=document.createElement("canvas");c.width=W*DPR;c.height=H*DPR;const o=c.getContext("2d");
 o.setTransform(DPR,0,0,DPR,0,0);o.fillStyle=color;o.textAlign="center";o.textBaseline="alphabetic";const ff=fo.f.replace(/'/g,"");
 o.font=`${fo.w} ${(H*0.5).toFixed(0)}px ${ff},sans-serif`;
 o.save();o.translate(W/2,H*0.44);o.scale(fitScale(o,"MARC",W*0.94),1);o.fillText("MARC",0,0);o.restore();
 o.save();o.translate(W/2,H*0.95);o.scale(fitScale(o,"KIMMEL",W*0.94),1);o.fillText("KIMMEL",0,0);o.restore();
 return c}

/* ============ INTERACTION MODES ============ */
const MODES=[
{id:"PUSH",tip:"Drag through the letters · Click to blast them",mount(pal,fo){
  const L=domLetters();
  const S=L.map(el=>{const r=el.getBoundingClientRect();return{el,hx:r.left+r.width/2,hy:r.top+r.height/2,x:0,y:0,vx:0,vy:0,r:0,vr:0}});
  const onClick=()=>{for(const s of S){const cx=s.hx+s.x,cy=s.hy+s.y,dx=cx-px,dy=cy-py,d=Math.hypot(dx,dy)||1,f=Math.min(70,5000/d);s.vx+=dx/d*f;s.vy+=dy/d*f;s.vr+=(Math.random()-0.5)*40}};/* shockwave — blast every letter away from the cursor */
  stage.addEventListener("click",onClick);
  let raf;(function loop(){
    for(const s of S){const cx=s.hx+s.x,cy=s.hy+s.y;let fx=-s.x*0.055,fy=-s.y*0.055;
      if(pactive){const dx=cx-px,dy=cy-py,d=Math.hypot(dx,dy)||1;
        if(d<240){const f=(1-d/240)*Math.min(34,8+pspeed*1.6);fx+=dx/d*f;fy+=dy/d*f;s.vr+=(dx/d)*1.1}}
      s.vx=(s.vx+fx)*0.85;s.vy=(s.vy+fy)*0.85;s.x+=s.vx;s.y+=s.vy;
      s.vr*=0.9;s.r=(s.r+s.vr)*0.94;
      s.el.style.transform=`translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px) rotate(${s.r.toFixed(1)}deg)`}
    raf=requestAnimationFrame(loop)})();
  return ()=>{cancelAnimationFrame(raf);stage.removeEventListener("click",onClick)};
}},
{id:"INVERT",tip:"Move the lens · click to flip",mount(pal,fo){
  domLetters();
  const lens=document.createElement("div");lens.className="invlens";stage.appendChild(lens);
  const onClick=()=>stage.classList.toggle("inverted");
  stage.addEventListener("click",onClick);
  let raf;(function loop(){lens.style.transform=`translate(${px}px,${sy()}px)`;raf=requestAnimationFrame(loop)})();
  return ()=>{cancelAnimationFrame(raf);stage.removeEventListener("click",onClick);stage.classList.remove("inverted")};
}},
{id:"MELT",tip:"Move to gooify — it keeps melting · Click resets",mount(pal,fo){
  const tv=curTreat==="outline"?`fill="none" stroke="${pal.fg}" stroke-width="${Math.max(2,H*0.006).toFixed(1)}"`:`fill="${pal.fg}"`;
  stage.innerHTML=`<svg class="msvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs><filter id="mp" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="2" seed="${Math.floor(rnd(200))}" result="n"><animate attributeName="baseFrequency" dur="14s" values="0.007 0.014;0.015 0.01;0.007 0.014" repeatCount="indefinite"/></feTurbulence><feDisplacementMap id="dm" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g filter="url(#mp)" font-family="${fo.f}" font-weight="${fo.w}" text-anchor="middle" ${tv}><text x="${W/2}" y="${H*0.44}" font-size="${H*0.5}" textLength="${W*0.94}" lengthAdjust="spacingAndGlyphs">MARC</text><text x="${W/2}" y="${H*0.95}" font-size="${H*0.5}" textLength="${W*0.94}" lengthAdjust="spacingAndGlyphs">KIMMEL</text></g></svg>`;
  const dm=stage.querySelector("#dm");let cur=0,raf;
  const onClick=()=>{cur=0};stage.addEventListener("click",onClick);
  (function loop(){if(pactive)cur=Math.min(240,cur+pspeed*0.6);dm.setAttribute("scale",cur.toFixed(1));raf=requestAnimationFrame(loop)})();/* gooifies more the more you move; never un-melts */
  return ()=>{cancelAnimationFrame(raf);stage.removeEventListener("click",onClick)};
}},
{id:"SPILL",tip:"Move to spill · Click to resize",mount(pal,fo){
  stage.innerHTML=svgText(fo,"none",`stroke="${pal.fg}" stroke-opacity="0.2" stroke-width="1.5"`)
    +`<canvas class="play pile"></canvas><canvas class="play act"></canvas>`;
  const pileC=stage.querySelector(".pile"),actC=stage.querySelector(".act");
  const pcx=pileC.getContext("2d"),acx=actC.getContext("2d");sizeCanvas(pileC);sizeCanvas(actC);
  const ff=fo.f.replace(/'/g,""),glyphs=[..."MARCKIMMEL"];
  const binW=26,bins=Math.max(1,Math.ceil(W/binW)),floor=new Float32Array(bins);/* pile height per column */
  const SIZES=[[40,90],[80,170],[150,290]];let si=1;                             /* click cycles spill size — big & varied */
  const parts=[];let raf,frame=0,total=0,seq=0;const MAX=3000;
  const onClick=()=>{si=(si+1)%SIZES.length};stage.addEventListener("click",onClick);
  function stamp(p){pcx.setTransform(DPR,0,0,DPR,0,0);pcx.fillStyle=pal.fg;pcx.textAlign="center";pcx.textBaseline="middle";
    pcx.save();pcx.font=`${fo.w} ${p.s.toFixed(0)}px ${ff},sans-serif`;pcx.translate(p.x,p.y);pcx.rotate(p.r);pcx.fillText(p.ch,0,0);pcx.restore()}
  (function loop(){frame++;
    /* fast, movement-driven spill — a hard sweep can fill the screen in ~5s */
    if(pactive&&pspeed>0.5&&total<MAX&&frame%9===0){const[a,b]=SIZES[si];/* sparse spew — one letter at a time so each shape reads */
      parts.push({x:Math.max(6,Math.min(W-6,px+rnd(24,-24))),y:sy()+rnd(12,-12),vx:rnd(2,-2),vy:rnd(2,-3),
        ch:glyphs[seq++%glyphs.length],r:rnd(.6,-.6),vr:rnd(.12,-.12),s:a+rnd(b-a),b:0});total++}/* spill in name order: M A R C K I M M E L … */
    acx.setTransform(1,0,0,1,0,0);acx.clearRect(0,0,actC.width,actC.height);
    acx.setTransform(DPR,0,0,DPR,0,0);acx.fillStyle=pal.fg;acx.textAlign="center";acx.textBaseline="middle";
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      if(p.x<6){p.x=6;p.vx=Math.abs(p.vx)*0.5}else if(p.x>W-6){p.x=W-6;p.vx=-Math.abs(p.vx)*0.5}/* bounce off the walls */
      let bin=Math.max(0,Math.min(bins-1,Math.round(p.x/binW)));

  function layout(){tiles.length=0;const top=(H-(2*rowH+pad))/2;words.forEach((word,ri)=>{const n=word.length,tw=Math.min(W*0.86/n,rowH*0.92),totalW=tw*1.04*n,x0=(W-totalW)/2,cy=top+ri*(rowH+pad)+rowH*0.5;
    for(let i=0;i<n;i++){const t={ch:word[i],cxp:x0+tw*1.04*i+tw/2,cy,w:tw*0.9,h:tw*0.9};styleTile(t);tiles.push(t);}});}
  layout();
  let hoverIdx=-1;
  function drawTile(t){cx.save();cx.translate(t.cxp+t.jx,t.cy+t.jy);cx.rotate(t.rot);
    cx.shadowColor="rgba(0,0,0,0.4)";cx.shadowBlur=9;cx.shadowOffsetY=4;cx.fillStyle=t.paper;
    if(t.torn){const w=t.w,h=t.h,s=7;cx.beginPath();for(let k=0;k<=s;k++)cx.lineTo(-w/2+w*k/s,-h/2+t.te[k]);for(let k=0;k<=s;k++)cx.lineTo(w/2-w*k/s,h/2+t.be[k]);cx.closePath();cx.fill();}
    else cx.fillRect(-t.w/2,-t.h/2,t.w,t.h);
    cx.shadowColor="transparent";
    const ch=t.up?t.ch.toUpperCase():t.ch.toLowerCase();cx.fillStyle=t.ink;cx.textAlign="center";cx.textBaseline="middle";
    let fs=t.h*0.72;cx.font=`${t.weight} ${fs}px "${t.font}",serif`;const mw=cx.measureText(ch).width;if(mw>t.w*0.8){fs*=t.w*0.8/mw;cx.font=`${t.weight} ${fs}px "${t.font}",serif`;}
    cx.fillText(ch,0,fs*0.04);cx.restore();
  }
  const onClick=()=>{for(const t of tiles)styleTile(t);};stage.addEventListener("click",onClick);
  let raf;
  (function loop(){const mx=px,my=sy();let hi=-1;
    for(let i=0;i<tiles.length;i++){const t=tiles[i];if(Math.abs(mx-t.cxp)<t.w*0.62&&Math.abs(my-t.cy)<t.h*0.62){hi=i;break;}}
    if(hi!==-1&&hi!==hoverIdx)styleTile(tiles[hi]);hoverIdx=hi;
    cx.setTransform(1,0,0,1,0,0);cx.fillStyle=pal.bg;cx.fillRect(0,0,cv.width,cv.height);cx.setTransform(DPR,0,0,DPR,0,0);
    for(const t of tiles)drawTile(t);
    raf=requestAnimationFrame(loop)})();
  return ()=>{cancelAnimationFrame(raf);stage.removeEventListener("click",onClick);};
}},
{id:"PINBALL",tip:"Nudge the ball with your paddle · Click to launch another",mount(pal,fo){
  stage.innerHTML=`<canvas class="play"></canvas>`;const cv=stage.querySelector(".play"),cx=cv.getContext("2d");sizeCanvas(cv);
  const ff=fo.f.replace(/'/g,""),BALLC=["#FF3B3B","#2FE8D5","#FFD23F","#B14BF4","#FF5AF2","#C6FF00","#3D6BFF","#FF6A00"];
  const words=["MARC","KIMMEL"],bump=[],rowH=H*0.32,gapR=H*0.05,topR=(H-(2*rowH+gapR))/2;
  words.forEach((word,ri)=>{const n=word.length,cw=W*0.92/n,x0=(W-cw*n)/2+cw/2,cy=topR+ri*(rowH+gapR)+rowH*0.5,r=Math.min(cw*0.33,rowH*0.3);
    for(let i=0;i<n;i++)bump.push({x:x0+cw*i+rnd(cw*0.09,-cw*0.09),y:cy+rnd(rowH*0.2,-rowH*0.2),r:r*rnd(1.12,0.86),ch:word[i],flash:0});});/* wider spread + staggered, slightly random placement & size */
  const balls=[],pr=Math.max(26,H*0.045);let ppx=px,ppy=sy();
  function launch(){if(balls.length>8)balls.shift();balls.push({x:px||W/2,y:sy()||H*0.8,vx:rnd(4,-4),vy:-rnd(9,6),r:Math.max(9,H*0.016),col:pick(BALLC)});}
  launch();
  const onClick=()=>launch();stage.addEventListener("click",onClick);
  let raf;
  (function loop(){const pdx=px-ppx,pdy=sy()-ppy,paddle={x:px,y:sy(),r:pr};
    cx.setTransform(1,0,0,1,0,0);cx.fillStyle=pal.bg;cx.fillRect(0,0,cv.width,cv.height);cx.setTransform(DPR,0,0,DPR,0,0);
    for(const b of bump){b.flash*=0.88;
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fillStyle=b.flash>0.02?`rgba(255,255,255,${(b.flash*0.5).toFixed(2)})`:"rgba(255,255,255,0)";cx.fill();
      cx.lineWidth=Math.max(2,b.r*0.12);cx.strokeStyle=pal.fg;cx.globalAlpha=0.5+0.5*b.flash;cx.stroke();cx.globalAlpha=1;
      cx.fillStyle=pal.fg;cx.textAlign="center";cx.textBaseline="middle";cx.font=`${fo.w} ${(b.r*1.1).toFixed(0)}px ${ff},sans-serif`;cx.fillText(b.ch,b.x,b.y+1);}
    for(const ba of balls){ba.vy+=0.2;ba.x+=ba.vx;ba.y+=ba.vy;
      if(ba.x<ba.r){ba.x=ba.r;ba.vx=Math.abs(ba.vx)*0.9;}if(ba.x>W-ba.r){ba.x=W-ba.r;ba.vx=-Math.abs(ba.vx)*0.9;}
      if(ba.y<ba.r){ba.y=ba.r;ba.vy=Math.abs(ba.vy)*0.9;}if(ba.y>H-ba.r){ba.y=H-ba.r;ba.vy=-Math.abs(ba.vy)*0.86;ba.vx*=0.98;}
      for(const b of bump){const dx=ba.x-b.x,dy=ba.y-b.y,dd=Math.hypot(dx,dy),rr=ba.r+b.r;if(dd<rr&&dd>0){const nx=dx/dd,ny=dy/dd;ba.x=b.x+nx*rr;ba.y=b.y+ny*rr;const dot=ba.vx*nx+ba.vy*ny;ba.vx-=2*dot*nx;ba.vy-=2*dot*ny;const sp=Math.hypot(ba.vx,ba.vy),boost=Math.max(sp,4)+2.2;ba.vx=nx*boost+ba.vx*0.2;ba.vy=ny*boost+ba.vy*0.2;b.flash=1;}}
      const dx=ba.x-paddle.x,dy=ba.y-paddle.y,dd=Math.hypot(dx,dy),rr=ba.r+paddle.r;if(dd<rr&&dd>0){const nx=dx/dd,ny=dy/dd;ba.x=paddle.x+nx*rr;ba.y=paddle.y+ny*rr;const dot=ba.vx*nx+ba.vy*ny;if(dot<0){ba.vx-=2*dot*nx;ba.vy-=2*dot*ny;}ba.vx+=pdx*0.5+nx*1.5;ba.vy+=pdy*0.5+ny*1.5;}
      const sp=Math.hypot(ba.vx,ba.vy),mxs=22;if(sp>mxs){ba.vx*=mxs/sp;ba.vy*=mxs/sp;}
      cx.beginPath();cx.arc(ba.x,ba.y,ba.r,0,7);cx.fillStyle=ba.col;cx.shadowColor=ba.col;cx.shadowBlur=ba.r*1.2;cx.fill();cx.shadowBlur=0;}
    cx.beginPath();cx.arc(paddle.x,paddle.y,paddle.r,0,7);cx.lineWidth=3;cx.strokeStyle=pal.fg;cx.globalAlpha=0.8;cx.stroke();cx.globalAlpha=1;
    cx.beginPath();cx.arc(paddle.x,paddle.y,paddle.r*0.16,0,7);cx.fillStyle=pal.fg;cx.fill();
    ppx=px;ppy=sy();
    raf=requestAnimationFrame(loop)})();
  return ()=>{cancelAnimationFrame(raf);stage.removeEventListener("click",onClick);};
}},
];

/* ============ version scheduler ============ */
let cleanup=null,idx=-1,lastMode=-1,timer,bag=[];
/* shuffled bag → every mode plays once per cycle before any repeats */
function nextMode(){if(!bag.length){bag=[...Array(MODES.length).keys()];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
  if(bag[bag.length-1]===lastMode&&bag.length>1){const t=bag[bag.length-1];bag[bag.length-1]=bag[0];bag[0]=t}}
  return bag.pop()}
function transition(){
 if(reduce)return;
 const k=pick(["flash","punch","iris"]);
 if(k==="flash"){stage.animate([{opacity:.2,filter:"invert(1)"},{opacity:1,filter:"none"}],{duration:420,easing:"ease-out"})}
 else if(k==="punch"){stage.animate([{transform:"scale(1.06)",filter:"blur(14px)"},{transform:"none",filter:"blur(0)"}],{duration:520,easing:"cubic-bezier(.2,.9,.15,1)"})}
 else{stage.animate([{clipPath:"circle(0% at 50% 50%)"},{clipPath:"circle(85% at 50% 50%)"}],{duration:620,easing:"cubic-bezier(.7,0,.25,1)"})}
}
function build(step){
 W=innerWidth;H=innerHeight-80;DPR=Math.min(2,devicePixelRatio||1);
 if(cleanup)cleanup();
 stage.classList.remove("inverted");
 idx=(idx+1)%1000;
 const m=nextMode();lastMode=m;
 const mode=MODES[m],pal=pick(PALS),fo=pick(FONTS);
 curTreat=pick(["solid","solid","solid","outline"]);/* random typography treatment, independent of mode/palette/font */
 body.style.setProperty("--bg",pal.bg);body.style.setProperty("--fg",pal.fg);
 body.style.setProperty("--ff",fo.f.replace(/'/g,""));body.style.setProperty("--fw",fo.w);
 cursorEl.className=mode.id;
 cleanup=mode.mount(pal,fo);
 readout.textContent=`Idx ${String(idx+1).padStart(2,"0")} · ${mode.id} — ${mode.tip}`;
 if(step)transition();
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{build(true);schedule()},reduce?16000:9000)}

build(false);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>build(false));
schedule();

/* manual advance — Space, or the NEXT label. (Click inside the stage is reserved for modes.) */
function advance(){build(true);schedule()}
document.getElementById("next").addEventListener("click",e=>{e.stopPropagation();advance()});
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();advance()}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>build(false),200)});
</script>
