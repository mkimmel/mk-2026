<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marc Kimmel</title>
<meta name="description" content="Marc Kimmel — design leader & builder. A live, interactive wordmark.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@800&family=Fraunces:opsz,wght@9..144,900&family=Space+Mono:wght@700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0A0A;--fg:#FFFFFF;--ff:'Archivo';--fw:800}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);cursor:none;
  font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;
  transition:background .5s ease,color .5s ease}

/* ---- structural chrome (persists across versions) ---- */
#marquee{position:fixed;top:0;left:0;right:0;height:34px;z-index:40;overflow:hidden;
  display:flex;align-items:center;border-bottom:2px solid var(--fg);background:var(--bg);
  transition:background .5s,border-color .5s}
.mq-track{display:inline-flex;white-space:nowrap;will-change:transform;animation:mq 34s linear infinite}
.mq-track span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:0 1.1em;color:var(--fg)}
@keyframes mq{to{transform:translateX(-50%)}}

#bar{position:fixed;bottom:0;left:0;right:0;height:34px;z-index:40;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 14px;white-space:nowrap;
  border-top:2px solid var(--fg);background:var(--bg);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;transition:background .5s,border-color .5s}
#bar a{color:var(--fg);text-decoration:none}
#bar a:hover{text-decoration:underline}
#bar>a,#bar>.right{flex:none}
#bar>.right{display:inline-flex;gap:1.4em;align-items:center}
#next{cursor:none;user-select:none}
#next:hover{opacity:.6}
#readout{flex:1;min-width:0;opacity:.7;text-align:center;overflow:hidden;text-overflow:ellipsis}

#grid{position:fixed;inset:34px 0;z-index:6;pointer-events:none;mix-blend-mode:difference;opacity:.12;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(16.666% - 1px),#fff calc(16.666% - 1px),#fff 16.666%)}

/* ---- stage where each mode mounts ---- */
#stage{position:fixed;inset:34px 0;z-index:10;overflow:hidden;isolation:isolate;background:var(--bg);
  transition:background .5s}
#stage.inverted{filter:invert(1)}

.lines{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:0}
.line{display:flex;justify-content:space-between;align-items:center;padding:0 2.2vw;line-height:.78;white-space:nowrap}
.ltr{font-family:var(--ff);font-weight:var(--fw);font-size:min(41vh,23vw);color:var(--fg);
  display:inline-block;will-change:transform;flex:none}

.msvg{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas.play{position:absolute;inset:0;width:100%;height:100%;display:block}

.invlens{position:fixed;width:320px;height:320px;border-radius:50%;background:#fff;
  mix-blend-mode:difference;pointer-events:none;z-index:20;margin:-160px 0 0 -160px;will-change:transform}

/* ---- custom cursor ---- */
#cursor{position:fixed;left:0;top:0;z-index:60;pointer-events:none;will-change:transform;
  width:26px;height:26px;margin:-13px 0 0 -13px;transition:width .2s,height .2s,margin .2s,opacity .2s}
#cursor .ring{width:100%;height:100%;border-radius:50%;border:2px solid var(--fg);mix-blend-mode:difference}
#cursor.PUSH{width:60px;height:60px;margin:-30px 0 0 -30px}
#cursor.INVERT{opacity:0}
#cursor.MELT .ring{border-radius:50%;background:var(--fg);border:none}
#cursor.SPILL,#cursor.PAINT{width:14px;height:14px;margin:-7px 0 0 -7px}
#cursor.SPILL .ring,#cursor.PAINT .ring{border-width:2px}

@media (prefers-reduced-motion:reduce){.mq-track{animation:none}}
</style>
</head>
<body>
<div id="marquee"><div class="mq-track" id="mqt"></div></div>
<div id="grid"></div>
<div id="stage"></div>
<div id="cursor"><div class="ring"></div></div>
<footer id="bar">
  <a href="mailto:mkimmel@gmail.com">mkimmel@gmail.com</a>
  <span id="readout">—</span>
  <span class="right"><span id="next">Space · Next ↘</span><span>Vancouver · <span id="date">—</span></span></span>
</footer>

<script>
const stage=document.getElementById("stage"),cursorEl=document.getElementById("cursor"),
      readout=document.getElementById("readout"),body=document.body;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W=innerWidth,H=innerHeight-68,DPR=Math.min(2,devicePixelRatio||1);

document.getElementById("date").textContent=
  new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}).toUpperCase();

/* marquee content from the JD */
const MQ=["Marc Kimmel","Design Director, Whisk @ Samsung","Experiences That Enrich & Elevate Daily Life","Building & Leading Global Teams","Prototyping AI-First Experiences","Customer Insights & Behavioural Science","Solve Problems, Tell Stories, Build Momentum"];
document.getElementById("mqt").innerHTML=[0,1].map(()=>MQ.map(s=>`<span>${s} ↘</span>`).join("")).join("");

/* ---- palettes: mostly high-contrast mono, occasional single accent ---- */
const PALS=[
 {bg:"#0A0A0A",fg:"#FFFFFF"},{bg:"#FFFFFF",fg:"#0A0A0A"},
 {bg:"#0A0A0A",fg:"#FFFFFF"},{bg:"#F2F0EA",fg:"#111111"},
 {bg:"#0A0A0A",fg:"#E8FF00"},{bg:"#111111",fg:"#FF3B3B"},
 {bg:"#1B1BFF",fg:"#FFFFFF"},{bg:"#FF3B3B",fg:"#111111"},
 {bg:"#E9EFEF",fg:"#05080A"},{bg:"#05080A",fg:"#2FE8D5"}
];
const FONTS=[{f:"'Anton'",w:400},{f:"'Archivo'",w:800},{f:"'Fraunces'",w:900},{f:"'Space Mono'",w:700}];
const rnd=(a=1,b=0)=>b+Math.random()*(a-b),pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---- global pointer + custom cursor ---- */
let px=innerWidth/2,py=innerHeight/2,ppx=px,ppy=py,pspeed=0,pactive=false;
addEventListener("pointermove",e=>{px=e.clientX;py=e.clientY;pactive=true});
addEventListener("pointerdown",e=>{px=e.clientX;py=e.clientY;pactive=true});
document.addEventListener("mouseleave",()=>pactive=false);
let mvF=0;
function ptrLoop(){pspeed=pspeed*0.75+Math.hypot(px-ppx,py-ppy)*0.25;ppx=px;ppy=py;
  cursorEl.style.transform=`translate(${px}px,${py}px)`;
  if(pspeed>1){if((++mvF)%18===0&&typeof schedule==="function")schedule()}/* keep the current toy alive while you play */
  requestAnimationFrame(ptrLoop)}
ptrLoop();
/* stage-local pointer (y within stage, which starts 34px down) */
const sy=()=>py-34;

function sizeCanvas(cv){cv.width=W*DPR;cv.height=H*DPR}

/* text as individual letters (DOM) */
function domLetters(){
 stage.innerHTML=`<div class="lines"><div class="line">${[...'MARC'].map(c=>`<span class="ltr">${c}</span>`).join("")}</div><div class="line">${[...'KIMMEL'].map(c=>`<span class="ltr">${c}</span>`).join("")}</div></div>`;
 return [...stage.querySelectorAll('.ltr')];
}
/* text as fitted SVG (fills width) */
function svgText(fo,fill,extra=""){return `<svg class="msvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><g font-family="${fo.f}" font-weight="${fo.w}" text-anchor="middle" ${extra}><text x="${W/2}" y="${H*0.44}" font-size="${H*0.5}" fill="${fill}" textLength="${W*0.94}" lengthAdjust="spacingAndGlyphs">MARC</text><text x="${W/2}" y="${H*0.95}" font-size="${H*0.5}" fill="${fill}" textLength="${W*0.94}" lengthAdjust="spacingAndGlyphs">KIMMEL</text></g></svg>`}

/* ============ INTERACTION MODES ============ */
const MODES=[
{id:"PUSH",tip:"Drag through the letters",mount(pal,fo){
  const L=domLetters();
  const S=L.map(el=>{const r=el.getBoundingClientRect();return{el,hx:r.left+r.width/2,hy:r.top+r.height/2,x:0,y:0,vx:0,vy:0,r:0,vr:0}});
  let raf;(function loop(){
    for(const s of S){const cx=s.hx+s.x,cy=s.hy+s.y;let fx=-s.x*0.055,fy=-s.y*0.055;
      if(pactive){const dx=cx-px,dy=cy-py,d=Math.hypot(dx,dy)||1;
        if(d<240){const f=(1-d/240)*Math.min(34,8+pspeed*1.6);fx+=dx/d*f;fy+=dy/d*f;s.vr+=(dx/d)*1.1}}
      s.vx=(s.vx+fx)*0.85;s.vy=(s.vy+fy)*0.85;s.x+=s.vx;s.y+=s.vy;
      s.vr*=0.9;s.r=(s.r+s.vr)*0.94;
      s.el.style.transform=`translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px) rotate(${s.r.toFixed(1)}deg)`}
    raf=requestAnimationFrame(loop)})();
  return ()=>cancelAnimationFrame(raf);
}},
{id:"INVERT",tip:"Move the lens · click to flip",mount(pal,fo){
  domLetters();
  const lens=document.createElement("div");lens.className="invlens";stage.appendChild(lens);
  const onClick=()=>stage.classList.toggle("inverted");
  stage.addEventListener("click",onClick);
  let raf;(function loop(){lens.style.transform=`translate(${px}px,${sy()}px)`;raf=requestAnimationFrame(loop)})();
  return ()=>{cancelAnimationFrame(raf);stage.removeEventListener("click",onClick);stage.classList.remove("inverted")};
}},
{id:"MELT",tip:"Move to melt the type",mount(pal,fo){
  stage.innerHTML=`<svg class="msvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs><filter id="mp" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="2" seed="${Math.floor(rnd(200))}" result="n"><animate attributeName="baseFrequency" dur="14s" values="0.007 0.014;0.015 0.01;0.007 0.014" repeatCount="indefinite"/></feTurbulence><feDisplacementMap id="dm" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g filter="url(#mp)" font-family="${fo.f}" font-weight="${fo.w}" text-anchor="middle" fill="${pal.fg}"><text x="${W/2}" y="${H*0.44}" font-size="${H*0.5}" textLength="${W*0.94}" lengthAdjust="spacingAndGlyphs">MARC</text><text x="${W/2}" y="${H*0.95}" font-size="${H*0.5}" textLength="${W*0.94}" lengthAdjust="spacingAndGlyphs">KIMMEL</text></g></svg>`;
  const dm=stage.querySelector("#dm");let cur=0,raf;
  (function loop(){const t=pactive?Math.min(160,30+pspeed*5):0;cur+=(t-cur)*0.12;dm.setAttribute("scale",cur.toFixed(1));raf=requestAnimationFrame(loop)})();
  return ()=>cancelAnimationFrame(raf);
}},
{id:"SPILL",tip:"Move to spill · Click to resize",mount(pal,fo){
  stage.innerHTML=svgText(fo,"none",`stroke="${pal.fg}" stroke-opacity="0.2" stroke-width="1.5"`)
    +`<canvas class="play pile"></canvas><canvas class="play act"></canvas>`;
  const pileC=stage.querySelector(".pile"),actC=stage.querySelector(".act");
  const pcx=pileC.getContext("2d"),acx=actC.getContext("2d");sizeCanvas(pileC);sizeCanvas(actC);
  const ff=fo.f.replace(/'/g,""),glyphs=[..."MARCKIMMEL"];
  const binW=22,bins=Math.max(1,Math.ceil(W/binW)),floor=new Float32Array(bins);/* pile height per column */
  const SIZES=[[12,22],[22,38],[40,66]];let si=1;                                /* click cycles spill size */
  const parts=[];let raf,frame=0,total=0;const MAX=1500;
  const onClick=()=>{si=(si+1)%SIZES.length};stage.addEventListener("click",onClick);
  function stamp(p){pcx.setTransform(DPR,0,0,DPR,0,0);pcx.fillStyle=pal.fg;pcx.textAlign="center";pcx.textBaseline="middle";
    pcx.save();pcx.font=`${fo.w} ${p.s.toFixed(0)}px ${ff},sans-serif`;pcx.translate(p.x,p.y);pcx.rotate(p.r);pcx.fillText(p.ch,0,0);pcx.restore()}
  (function loop(){frame++;
    /* slow, movement-driven spill */
    if(pactive&&pspeed>0.5&&total<MAX&&frame%5===0){const[a,b]=SIZES[si];
      parts.push({x:Math.max(6,Math.min(W-6,px)),y:sy(),vx:rnd(1,-1),vy:rnd(1.4,0),
        ch:pick(glyphs),r:rnd(.5,-.5),vr:rnd(.06,-.06),s:a+rnd(b-a)});total++}
    acx.setTransform(1,0,0,1,0,0);acx.clearRect(0,0,actC.width,actC.height);
    acx.setTransform(DPR,0,0,DPR,0,0);acx.fillStyle=pal.fg;acx.textAlign="center";acx.textBaseline="middle";
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=0.16;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      let bin=Math.max(0,Math.min(bins-1,Math.round(p.x/binW)));
      const bl=bin>0?floor[bin-1]:1e9,br=bin<bins-1?floor[bin+1]:1e9,here=floor[bin];/* roll to a lower neighbour */
      if(bl<here-p.s*0.4&&bl<=br)bin--;else if(br<here-p.s*0.4)bin++;
      const restY=H-floor[bin]-p.s*0.34;
      if(p.y>=restY&&p.vy>0){p.x=bin*binW+binW/2+rnd(binW*0.3,-binW*0.3);p.y=restY;stamp(p);floor[bin]+=p.s*0.5;parts.splice(i,1);continue}
      acx.save();acx.font=`${fo.w} ${p.s.toFixed(0)}px ${ff},sans-serif`;acx.translate(p.x,p.y);acx.rotate(p.r);acx.fillText(p.ch,0,0);acx.restore()}
    raf=requestAnimationFrame(loop)})();
  return ()=>{cancelAnimationFrame(raf);stage.removeEventListener("click",onClick)};
}},
{id:"PAINT",tip:"Move to draw · Click clears",mount(pal,fo){
  stage.innerHTML=svgText(fo,"none",`stroke="${pal.fg}" stroke-opacity="0.2" stroke-width="1.5"`)+`<canvas class="play"></canvas>`;
  const cv=stage.querySelector(".play"),cx=cv.getContext("2d");sizeCanvas(cv);let raf,lx=px,ly=sy();
  const onClick=()=>cx.clearRect(0,0,cv.width,cv.height);stage.addEventListener("click",onClick);
  (function loop(){
    if(pactive&&pspeed>0.5){cx.strokeStyle=pal.fg;cx.lineCap="round";cx.lineWidth=Math.min(46,2+pspeed*0.9)*DPR;
      cx.beginPath();cx.moveTo(lx*DPR,ly*DPR);cx.lineTo(px*DPR,sy()*DPR);cx.stroke()}
    lx=px;ly=sy();raf=requestAnimationFrame(loop)})();
  return ()=>{cancelAnimationFrame(raf);stage.removeEventListener("click",onClick)};
}}
];

/* ============ version scheduler ============ */
let cleanup=null,idx=-1,lastMode=-1,timer;
function transition(){
 if(reduce)return;
 const k=pick(["flash","punch","iris"]);
 if(k==="flash"){stage.animate([{opacity:.2,filter:"invert(1)"},{opacity:1,filter:"none"}],{duration:420,easing:"ease-out"})}
 else if(k==="punch"){stage.animate([{transform:"scale(1.06)",filter:"blur(14px)"},{transform:"none",filter:"blur(0)"}],{duration:520,easing:"cubic-bezier(.2,.9,.15,1)"})}
 else{stage.animate([{clipPath:"circle(0% at 50% 50%)"},{clipPath:"circle(85% at 50% 50%)"}],{duration:620,easing:"cubic-bezier(.7,0,.25,1)"})}
}
function build(step){
 W=innerWidth;H=innerHeight-68;DPR=Math.min(2,devicePixelRatio||1);
 if(cleanup)cleanup();
 stage.classList.remove("inverted");
 idx=(idx+1)%1000;
 let m;do{m=Math.floor(Math.random()*MODES.length)}while(m===lastMode&&MODES.length>1);lastMode=m;
 const mode=MODES[m],pal=pick(PALS),fo=pick(FONTS);
 body.style.setProperty("--bg",pal.bg);body.style.setProperty("--fg",pal.fg);
 body.style.setProperty("--ff",fo.f.replace(/'/g,""));body.style.setProperty("--fw",fo.w);
 cursorEl.className=mode.id;
 cleanup=mode.mount(pal,fo);
 readout.textContent=`Idx ${String(idx+1).padStart(2,"0")} · ${mode.id} — ${mode.tip}`;
 if(step)transition();
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{build(true);schedule()},reduce?14000:7000)}

build(false);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>build(false));
schedule();

/* manual advance — Space, or the NEXT label. (Click inside the stage is reserved for modes.) */
function advance(){build(true);schedule()}
document.getElementById("next").addEventListener("click",e=>{e.stopPropagation();advance()});
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();advance()}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>build(false),200)});
</script>
</body>
</html>
